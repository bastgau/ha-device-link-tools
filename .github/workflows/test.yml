---
name: "Test"

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  # Required status checks (branch protection) wait forever if the workflow
  # itself never runs, which is what a top-level `paths:` filter causes on a
  # PR that touches no .py file. This job always runs and tells the two real
  # jobs below whether to do actual work or report a no-op success, so the
  # check always reports instead of staying stuck on "Expected".
  changes:
    name: "changes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    outputs:
      python: "${{ steps.filter.outputs.python }}"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "dorny/paths-filter@v4"
        id: "filter"
        with:
          filters: |
            python:
              - "custom_components/device_link_tools/**/*.py"
              - "tests/**/*.py"
              - "uv.lock"
              - "pyproject.toml"
              - ".python-version"
              - ".coveragerc*"
              - ".github/workflows/test.yml"

  integration:
    name: "integration"
    needs: "changes"
    if: "needs.changes.outputs.python == 'true'"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"

      # No setup-python: uv provisions the interpreter from .python-version and
      # the requires-python bound in pyproject.toml.
      - name: "Set up uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked fails the job if uv.lock is stale, which is the freshness check.
      - name: "Install the integration test environment"
        run: "uv sync --locked --no-default-groups --group test"

      - name: "Run the integration tests"
        run: |
          uv run --frozen --no-sync pytest tests \
            -o addopts="" \
            --cov \
            --cov-config=.coveragerc-integration \
            --cov-report=term-missing \
            --cov-fail-under=95
