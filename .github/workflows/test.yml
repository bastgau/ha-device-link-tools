---
name: "Test"

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  PYTHON_VERSION: "3.14"

jobs:
  # Required status checks (branch protection) wait forever if the workflow
  # itself never runs, which is what a top-level `paths:` filter causes on a
  # PR that touches no .py file. This job always runs and tells the two real
  # jobs below whether to do actual work or report a no-op success, so the
  # check always reports instead of staying stuck on "Expected".
  changes:
    name: "changes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    outputs:
      python: "${{ steps.filter.outputs.python }}"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "dorny/paths-filter@v4"
        id: "filter"
        with:
          filters: |
            python:
              - "custom_components/device_link_tools/**/*.py"
              - "tests/**/*.py"
              - "requirements.txt"
              - "requirements-test.txt"
              - "pyproject.toml"
              - ".coveragerc*"
              - ".github/workflows/test.yml"

  integration:
    name: "integration"
    needs: "changes"
    if: "needs.changes.outputs.python == 'true'"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"

      - name: "Set up Python"
        uses: "actions/setup-python@v7"
        with:
          python-version: "${{ env.PYTHON_VERSION }}"
          cache: "pip"
          cache-dependency-path: "requirements-test.txt"

      - name: "Install the integration test environment"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: "Run the integration tests"
        run: |
          pytest tests \
            -o addopts="" \
            --cov \
            --cov-config=.coveragerc-integration \
            --cov-report=term-missing \
            --cov-fail-under=95
