[project]
# Not a distributable package: this is a HACS custom component, shipped as a zip
# built by .github/workflows/release.yml from custom_components/. The name is the
# PEP 508 form of the integration's title.
name = "device-link-tools"
version = "0.0.0"
description = "Link existing entities to an existing device, for entities whose own integration offers no device option."
readme = "README.md"
# >=3.14.2 is homeassistant==2026.9.0b3's own Requires-Python; the upper bound keeps
# the lock inside a single minor. The exact patch lives in .python-version.
requires-python = ">=3.14.2,<3.15"
# Home Assistant is a project dependency rather than a group member: scripts/develop
# runs it, and pylint and pyright need it to resolve the integration's imports
# against the very release the tests run against.
dependencies = ["homeassistant==2026.9.0b3"]

[dependency-groups]
# Installed by a bare `uv sync`: everything a developer needs.
dev = ["prek==0.5.0", { include-group = "lint" }, { include-group = "test" }]

lint = [
  "pylint==4.0.7",
  "pyright==1.1.411",
  # Keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml, so the
  # hook and scripts/lint can never format a file differently.
  "ruff==0.16.4",
  # Not on PyPI: installed straight from its GitHub release asset.
  "docstring-linter @ https://github.com/bastgau/docstring-linter/releases/download/v0.9.0/docstring_linter-0.9.0-py3-none-any.whl",
]

# pytest, pytest-asyncio, pytest-cov and coverage are pinned exactly by
# pytest-homeassistant-custom-component's own requirements - do not repeat them.
test = ["pytest-homeassistant-custom-component==0.13.360"]

# Requirements of the default_config: integrations (frontend, ffmpeg, usb, dhcp,
# bluetooth, matter...), which only scripts/develop needs to boot a real Home
# Assistant. Left out of default-groups, so a plain `uv sync` does not install
# them; scripts/setup asks for the group explicitly.
#
# Home Assistant pins every one of these in its own manifests, so their versions
# are a function of the homeassistant pin above, not a free choice: they are
# regenerated wholesale by scripts/update_requirements, and Dependabot is told to
# ignore them in .github/dependabot.yml for the same reason.
# BEGIN default-config - auto-generated by scripts/update_requirements
default-config = [
  "aiodhcpwatcher==1.2.7",
  "aiodiscover==3.3.2",
  "aioesphomeapi==46.2.0",
  "aiohasupervisor==0.6.0",
  "aiousbwatcher==1.1.2",
  "async-upnp-client==0.48.1",
  "av==17.0.1",
  "bleak==3.0.2",
  "bleak-esphome==4.0.0",
  "bleak-retry-connector==4.6.3",
  "bluetooth-adapters==2.4.0",
  "bluetooth-auto-recovery==1.6.4",
  "bluetooth-data-tools==1.29.21",
  "cached-ipaddress==1.1.2",
  "cronsim==2.7",
  "dbus-fast==5.0.22",
  "esphome-dashboard-api==1.4.0",
  "file-read-backwards==2.0.0",
  "fnv-hash-fast==2.0.3",
  "gazetteer-matcher==1.1.0",
  "go2rtc-client==0.4.0",
  "ha-ffmpeg==3.2.2",
  "habluetooth==6.26.7",
  "hass-nabucasa==2.7.0",
  "hassil==3.12.0",
  "home-assistant-frontend==20260826.1",
  "home-assistant-intents==2026.8.28",
  "ifaddr==0.2.0",
  "matter-ble-proxy==0.7.1",
  "matter-python-client==1.4.0",
  "mutagen==1.48.1",
  "numpy==2.3.2",
  "openai==2.45.0",
  "Pillow==12.3.0",
  "psutil-home-assistant==0.0.1",
  "pymicro-vad==1.0.1",
  "PyNaCl==1.6.2",
  "pyspeex-noise==1.0.2",
  "PyTurboJPEG==1.8.3",
  "securetar==2026.4.1",
  "serialx==1.9.0",
  "SQLAlchemy==2.0.52",
  "zeroconf==0.151.1",
]
# END default-config

[tool.uv]
# Older uv ignores PEP 735 groups and cannot download CPython 3.14.
required-version = ">=0.9"
# Mirrors poetry's package-mode = false: install the dependencies, never build or
# install custom_components/ itself.
package = false
default-groups = ["dev"]

[tool.ruff]
# NOTE: runtime target is Python 3.14, but ruff's target-version is intentionally
# pinned to py313 to avoid a known ruff 0.15.x formatter bug that rewrites
# `except (A, B):` into the PEP 758 form `except A, B:` (invalid on Python <=3.13).
# Bump back to "py314" once the ruff formatter fix ships.
target-version = "py313"
line-length = 120
indent-width = 4
src = ["custom_components/device_link_tools"]
exclude = ["tests/testing_config/*", "tests/typing.py", "tests/common.py"]

[tool.ruff.lint]
ignore = [
  "ANN401",  # Opiniated warning on disallowing dynamically typed expressions
  "D203",    # Conflicts with other rules
  "D213",    # Conflicts with other rules
  "TID252",  # Relative imports
  "RUF012",  # Just broken
  "D202",    # No blank lines allowed after function docstring
  "D404",    # First word of the docstring should not be This
  "D406",    # Section name should end with a newline
  "D407",    # Section name underlining
  "D411",    # Missing blank line before section
  "E501",    # line too long
  "E731",    # do not assign a lambda expression, use a def
  "PLR2004", # Magic value used in comparison, consider replacing `xxx` with a constant variable
  "FBT001",  # Boolean default positional argument in function definition
  "FBT002",  # Boolean-typed positional argument in function definition
  "ARG002",  # Unused method argument: `kwargs`
  "PLR0911", # Too many return statements (19 > 6)
  "PLR0912", # Too many branches
  "PLR0915", # Too many statements (58 > 50)
  "BLE001",  # Do not catch blind exception: `Exception`
  "S110",    # `try`-`except`-`pass` detected, consider logging the exception
  "CPY001",  # No copyright header convention in this project

  # Formatter conflicts
  "COM812",
  "COM819",
  "D206",
  "ISC001",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "W191",
]
select = ["ALL"]

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"homeassistant.helpers.area_registry" = "ar"
"homeassistant.helpers.config_validation" = "cv"
"homeassistant.helpers.device_registry" = "dr"
"homeassistant.helpers.entity_registry" = "er"
"homeassistant.helpers.issue_registry" = "ir"
voluptuous = "vol"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # Use of `assert` detected -- standard in pytest test bodies
  "S105",    # Possible hardcoded password -- fixture credentials, not real secrets
  "ARG001",  # Unused function argument
  "ARG005",  # Unused lambda argument
  "PLR0917", # Too many positional arguments
  "PLR0913", # Too many arguments in function definition
  "SLF001",  # Private member accessed"
]

[tool.pylint.MASTER]
ignore-paths = ["(.*/)?tests/common.py", "(.*/)?tests/testing_config/.*"]
load-plugins = ["pylint.extensions.docparams"]

[tool.pylint."MESSAGES CONTROL"]
# Reasons disabled:
# format - handled by ruff
# duplicate-code - unavoidable
# used-before-assignment - false positives with TYPE_CHECKING structures
# wrong-import-order - pylint has no equivalent to ruff's known-first-party;
#   homeassistant is treated as first-party by ruff/isort (see [tool.ruff.lint.isort]),
#   which pylint's import checker cannot be configured to match.
disable = [
  "abstract-method",
  "duplicate-code",
  "format",
  "unexpected-keyword-arg",
  "used-before-assignment",
  "wrong-import-order",
]
max-args = 6
max-positional-arguments = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-homeassistant-custom-component's autouse fixture
# `enable_event_loop_debug` is declared with @pytest.fixture despite being
# async, which pytest-asyncio only tolerates in "auto" mode ("strict" raises
# PytestRemovedIn9Warning: async fixture with no plugin/hook handling it).
asyncio_mode = "auto"
addopts = "--cov=custom_components/device_link_tools --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["custom_components/device_link_tools"]
# VSCode's Python Testing extension invokes pytest with its own --cov=.
# argument, overriding `source` above. `omit` still applies afterwards, so
# it keeps tests/ out of the coverage report regardless of how pytest-cov
# was invoked (scripts/test, VSCode, CI, ...).
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.docstring-linter]
style = "google"
select = ["ALL"]
ignore_placeholder_docstrings = false
workers = 1
summary_max_length = 120
returns_none = "forbidden"
exclude = ["testing_config", "tests/typing.py", "tests/common.py"]

[[tool.docstring-linter.overrides]]
ignore = ["imperative_mood"]
paths = ["tests/*.py"]
args_section = "forbidden"
returns_section = "forbidden"
yields_section = "forbidden"
raises_section = "forbidden"
attributes_section = "forbidden"
description_section = "optional"
examples_section = "forbidden"
notes_section = "forbidden"
todo_section = "forbidden"
blank_lines_before_closing_quotes = 0

[[tool.docstring-linter.overrides]]
paths = ["custom_components/device_link_tools/*.py"]
summary_max_length = 120
