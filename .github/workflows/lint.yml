---
name: "Lint"

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  changes:
    name: "changes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    outputs:
      python: "${{ steps.filter.outputs.python }}"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "dorny/paths-filter@v4"
        id: "filter"
        with:
          filters: |
            python:
              - "custom_components/device_link_tools/**/*.py"
              - "tests/**/*.py"
              - "uv.lock"
              - "pyproject.toml"
              - ".python-version"
              - ".github/workflows/lint.yml"

  lint:
    name: "${{ matrix.name }}"
    needs: "changes"
    if: "needs.changes.outputs.python == 'true'"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "integration"
            paths: "custom_components/device_link_tools/*.py"
            groups: "--group lint"
          - name: "tests"
            paths: "tests"
            groups: "--group lint --group test"

    steps:
      - name: "Check out the repository"
        uses: "actions/checkout@v7"

      # No setup-python: uv provisions the interpreter from .python-version and
      # the requires-python bound in pyproject.toml.
      - name: "Set up uv"
        uses: "astral-sh/setup-uv@v7"
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # --locked fails the job if uv.lock is stale, which is the freshness check.
      # --no-default-groups keeps each leg to its own groups; the dev group would
      # otherwise install everything on both and collapse the matrix.
      - name: "Install the lint toolchain"
        run: "uv sync --locked --no-default-groups ${{ matrix.groups }}"

      # Put the synced venv on PATH so the checks below stay bare commands,
      # identical to the ones scripts/lint runs.
      - name: "Expose the virtualenv"
        run: 'echo "$PWD/.venv/bin" >> "$GITHUB_PATH"'

      - name: "Lint with Ruff"
        if: "success()"
        run: ruff check --output-format=github ${{ matrix.paths }}

      - name: "Format with Ruff"
        if: "!cancelled()"
        run: ruff format --check --diff ${{ matrix.paths }}

      - name: "Lint with Pylint"
        if: "!cancelled()"
        run: pylint ${{ matrix.paths }}

      - name: "Lint with Pyright"
        if: "!cancelled()"
        run: pyright ${{ matrix.paths }}

      - name: "Lint with docstring-linter"
        if: "!cancelled()"
        run: docstring-linter ${{ matrix.paths }}
