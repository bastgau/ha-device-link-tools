version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "pr:chore"
    commit-message:
      prefix: "chore"
    # The default-config group in pyproject.toml mirrors what Home Assistant pins
    # in its own manifests, so its versions follow the homeassistant pin and are
    # rewritten wholesale by scripts/update_requirements. A bump proposed here
    # would be reverted by the next run, so these are ignored instead. uv cannot
    # yet filter by dependency type (dependabot-core#13202), hence the explicit
    # list, which that same script regenerates.
    # BEGIN default-config ignores - auto-generated by scripts/update_requirements
    ignore:
      - dependency-name: "aiodhcpwatcher"
      - dependency-name: "aiodiscover"
      - dependency-name: "aioesphomeapi"
      - dependency-name: "aiohasupervisor"
      - dependency-name: "aiousbwatcher"
      - dependency-name: "async-upnp-client"
      - dependency-name: "av"
      - dependency-name: "bleak"
      - dependency-name: "bleak-esphome"
      - dependency-name: "bleak-retry-connector"
      - dependency-name: "bluetooth-adapters"
      - dependency-name: "bluetooth-auto-recovery"
      - dependency-name: "bluetooth-data-tools"
      - dependency-name: "cached-ipaddress"
      - dependency-name: "cronsim"
      - dependency-name: "dbus-fast"
      - dependency-name: "esphome-dashboard-api"
      - dependency-name: "file-read-backwards"
      - dependency-name: "fnv-hash-fast"
      - dependency-name: "gazetteer-matcher"
      - dependency-name: "go2rtc-client"
      - dependency-name: "ha-ffmpeg"
      - dependency-name: "habluetooth"
      - dependency-name: "hass-nabucasa"
      - dependency-name: "hassil"
      - dependency-name: "home-assistant-frontend"
      - dependency-name: "home-assistant-intents"
      - dependency-name: "ifaddr"
      - dependency-name: "matter-ble-proxy"
      - dependency-name: "matter-python-client"
      - dependency-name: "mutagen"
      - dependency-name: "numpy"
      - dependency-name: "openai"
      - dependency-name: "Pillow"
      - dependency-name: "psutil-home-assistant"
      - dependency-name: "pymicro-vad"
      - dependency-name: "PyNaCl"
      - dependency-name: "pyspeex-noise"
      - dependency-name: "PyTurboJPEG"
      - dependency-name: "securetar"
      - dependency-name: "serialx"
      - dependency-name: "SQLAlchemy"
      - dependency-name: "zeroconf"
    # END default-config ignores

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "pr:chore"
    commit-message:
      prefix: "chore"
